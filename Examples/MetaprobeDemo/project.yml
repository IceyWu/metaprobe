name: MetaprobeDemo
options:
  deploymentTarget:
    iOS: "27.0"
packages:
  metaprobe:
    path: ../..
targets:
  MetaprobeDemo:
    type: application
    platform: iOS
    sources:
      - path: .
    dependencies:
      - package: metaprobe
        product: MetaprobeSwift
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.iceywu.metaprobe-demo
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      SWIFT_VERSION: 5.9
